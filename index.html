<!doctype html>

<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>TerraScarify マニューバクリエイター</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body id="bg">
    <main class="h-screen flex flex-col">
      <header class="shadow-sm font-bold text-xl p-2 bg-white">
        TerraScarify マニューバクリエイター
      </header>

      <!-- 編集用枠 -->
      <div
        class="m-2 flex-1 min-h-0 border border-gray-800 bg-white/80 shadow-sm"
      >
        <div class="flex h-full w-full">
          <!-- 左側 -->
          <div id="left" class="h-full w-2/5 overflow-auto flex flex-col">
            <div class="flex flex-row">
              <div class="flex-1 p-1 font-bold">プレビュー</div>
              <div class="p-1">
                <button
                  type="button"
                  class="rounded-sm border border-gray-300 bg-gray-100 shadow-xs text-sm p-0.5 hover:bg-gray-200 hover:cursor-pointer"
                >
                  コピー
                </button>
              </div>
            </div>
            <div
              class="border bg-white/50 h-full min-h-0 m-1 mt-0 overflow-y-auto whitespace-pre-wrap wrap-break-words p-1"
              id="preview"
            ></div>
          </div>

          <!-- 境界 -->
          <div
            id="splitter"
            class="h-full w-1 cursor-col-resize bg-gray-400 hover:bg-blue-300"
          ></div>

          <!-- 右側 -->
          <div id="right" class="h-full min-w-0 flex-1 flex flex-col">
            <div class="flex flex-row">
              <div class="flex-1 p-1 font-bold">エディター</div>
              <div class="p-1">
                <button
                  type="button"
                  class="rounded-sm border border-gray-300 bg-gray-100 shadow-xs text-sm p-0.5 hover:bg-gray-200 hover:cursor-pointer"
                >
                  インポート
                </button>
              </div>
            </div>
            <div
              class="border bg-white/50 h-full min-h-0 m-1 mt-0 overflow-y-auto whitespace-pre-wrap wrap-break-words p-1"
              id="preview"
            ></div>
          </div>
        </div>
      </div>
    </main>
    <script src="js/main.js" defer></script>
  </body>
</html>
